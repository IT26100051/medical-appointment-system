# ============================================================================
#  Medical Appointment Scheduling System - application configuration
# ============================================================================
spring.application.name=Medical Appointment Scheduling System

# ---- Web server -------------------------------------------------------------
server.port=8080
server.address=0.0.0.0

# ---- Database (H2 file database - data survives an application restart) -----
# The database file is created in the ./data folder of the project (the folder
# that holds "frontend" and "backend"), whatever folder the app is started from.
spring.datasource.url=jdbc:h2:file:./data/medcare
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# H2 web console (optional, handy for demonstrating the stored records)
# http://localhost:8080/h2-console  ->  JDBC URL: jdbc:h2:file:./data/medcare
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Website files ----------------------------------------------------------
# The website is kept in the frontend folder next to this project.  Editing a
# page and refreshing the browser shows the change immediately; the same folder
# is also packaged inside the jar so the built application still works alone.
spring.web.resources.static-locations=file:./frontend/,file:../frontend/,classpath:/static/

# ---- Application specific settings -----------------------------------------
# Folder for the readable text data files / clinic documents (created next to
# the frontend folder, so you can open them straight from the project tree).
app.output.dir=documents
# Load the demonstration accounts, doctors, slots and appointments at startup
# when the database is empty.
app.seed.demo-data=true
app.audit.enabled=true

# ---- JSON date formatting ---------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- Quiet logging on startup ----------------------------------------------
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.medcare=INFO
